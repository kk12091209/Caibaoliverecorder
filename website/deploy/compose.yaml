name: caibao-web
services:
  web:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f}
    restart: unless-stopped
    environment:
      COS_PUBLIC_ORIGIN: ${COS_PUBLIC_ORIGIN:?Set the public HTTPS COS origin in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/caibao:/srv/caibao:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  sync:
    image: caibao-sync:${CAIBAO_BUILD:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sync
    profiles: [sync]
    init: true
    user: "10001:10001"
    env_file:
      - /etc/caibao/sync.env
    environment:
      SYNC_STATE_DIR: /state
      RELEASE_CATALOG: /catalog/catalog.json
    volumes:
      - /var/lib/caibao-sync:/state
      - /srv/caibao/catalog:/catalog
      - /etc/caibao/keys:/keys:ro
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
