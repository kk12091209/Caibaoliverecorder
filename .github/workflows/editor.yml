name: Editor checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Test editor and build frontend
        shell: pwsh
        working-directory: live-editor
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/dev-env.ps1
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed.' }
          ./scripts/prepare-release-tools.ps1 -SkipMediaBuild
          $toolRoot = Join-Path (Split-Path $PWD -Parent) '.tools/release-tools'
          $mediaRoot = Join-Path (Split-Path $PWD -Parent) '.tools/ci-media'
          New-Item -ItemType Directory -Force -Path $mediaRoot | Out-Null
          $archive = Join-Path $mediaRoot 'ffmpeg-8.1.2-essentials_build.7z'
          node ./scripts/fetch-tool.mjs 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.7z' $archive 'e25b682664025d49034c981afb4bae36238a40f29a3cc1c713ad9a8b5b3528f6'
          if ($LASTEXITCODE -ne 0) { throw 'Test FFmpeg download failed.' }
          & (Join-Path $toolRoot '7zip/7z.exe') x $archive ("-o$mediaRoot") -y -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'Test FFmpeg extraction failed.' }
          $ffmpegRoot = Join-Path $mediaRoot 'ffmpeg-8.1.2-essentials_build/bin'
          $env:FFMPEG_PATH = Join-Path $ffmpegRoot 'ffmpeg.exe'
          $env:FFPROBE_PATH = Join-Path $ffmpegRoot 'ffprobe.exe'
          node --test test/*.test.js scripts/dev.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test shared editor and macOS core lifecycle
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew's minimal FFmpeg omits libass. Exercise the same pinned
          # arm64 binaries shipped to users, including actual subtitle rendering.
          [[ $(uname -m) == arm64 ]] || { echo 'This job requires an arm64 Mac runner'; exit 1; }
          source live-editor/scripts/dev-env.sh
          node live-editor/scripts/fetch-tool.mjs 'https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip' .tools/downloads/ffmpeg.zip c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
          node live-editor/scripts/fetch-tool.mjs 'https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip' .tools/downloads/ffprobe.zip fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6
          mkdir -p .tools/runtime/ffmpeg
          unzip -q .tools/downloads/ffmpeg.zip -d .tools/runtime/ffmpeg
          unzip -q .tools/downloads/ffprobe.zip -d .tools/runtime/ffmpeg
          chmod +x "$FFMPEG_PATH" "$FFPROBE_PATH"
          "$FFMPEG_PATH" -hide_banner -filters | grep ' ass '
          RID=osx-x64
          if [[ $(uname -m) == arm64 ]]; then RID=osx-arm64; fi
          dotnet publish BililiveRecorder.Cli/BililiveRecorder.Cli.csproj -c Release -r "$RID" -p:RuntimeIdentifiers="$RID" --self-contained true -o .tools/runtime/recorder
          cd live-editor
          npm ci
          node --test --test-concurrency=2 test/*.test.js scripts/dev.test.js
          CAIBO_CORE_SMOKE=1 node --test test/local-endpoint.test.js
          npm run build
          cd ..
          dotnet test test/BililiveRecorder.Core.UnitTests/BililiveRecorder.Core.UnitTests.csproj -c Release -f net8.0
          TMPDIR=/private/tmp xcrun swiftc -swift-version 5 -O -framework AppKit -framework WebKit -framework IOKit live-editor/desktop-macos/Backend.swift live-editor/desktop-macos/App.swift -o .tools/CaiboDesktop
