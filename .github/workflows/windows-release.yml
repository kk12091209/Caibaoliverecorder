name: Isolated Windows publication regression
on:
  workflow_dispatch:
    inputs:
      release_channel:
        type: choice
        options: [beta]
        default: beta
      publish_draft:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publication:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Reproduce using the verified previous release FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.publish_draft }}' -eq 'true') { throw 'Diagnostic workflow does not publish.' }
          $release=Invoke-RestMethod -Uri 'https://api.github.com/repos/kk12091209/Caibaoliverecorder/releases/latest' -Headers @{Authorization="Bearer $env:GH_TOKEN"}
          $asset=@($release.assets | Where-Object {$_.name -match '^BiliLiveEditor-[0-9.]+-win-x64.zip$'})
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:([a-f0-9]{64})$') { throw 'Previous package is not verified' }
          node live-editor/scripts/fetch-tool.mjs $asset[0].browser_download_url .tools/ui-previous.zip $Matches[1]
          if ($LASTEXITCODE -ne 0) { throw 'Previous package download failed' }
          Expand-Archive .tools/ui-previous.zip .tools/ui-previous
          $env:FFMPEG_PATH=(Get-ChildItem .tools/ui-previous -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $env:FFPROBE_PATH=(Get-ChildItem .tools/ui-previous -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          Set-Location live-editor
          for ($index=1; $index -le 12; $index++) {
            node --test --test-concurrency=2 test/automatic-publication-pipeline.test.js test/auto-post.test.js test/bilibili-publisher.test.js
            if ($LASTEXITCODE -ne 0) { throw "Publication regression failed in iteration $index" }
          }
