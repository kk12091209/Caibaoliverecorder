name: Website checks
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - name: Check standalone deployment package
        run: node scripts/package-deploy.mjs
