name: 问题反馈
description: 反馈菜播·录包机的录制、剪辑、导出或清理问题
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、账号凭据、个人路径或不希望公开的直播内容。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 v0.1.0，使用 ZIP 便携包
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与显卡
      placeholder: Windows 11 x64 / NVIDIA、AMD 或 Intel 显卡型号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期结果与实际结果
      description: 导出问题请说明整场或选段、纯净版或弹幕版，以及是否已经完成预处理。
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: 报错或截图
      description: 请先移除个人信息；不要直接上传整个 data 目录。
