name: 功能建议
description: 描述你的使用场景与希望改善的体验
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你在录制、回看、剪辑或导出时遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 请说明期望的操作和结果；若涉及性能，也请描述设备和素材长度。
    validations:
      required: true
